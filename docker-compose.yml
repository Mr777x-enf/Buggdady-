services:
  pgvector:
    image: pgvector/pgvector:pg18
    container_name: code_debugger_pgvector

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - pgvector_data:/var/lib/postgresql/postgresql

volumes:
  pgvector_data: